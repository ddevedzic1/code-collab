spring.application.name=system-events-service
server.port=8084

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/system_events_service_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

app.database.schema=system_events_service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${app.database.schema}
spring.jpa.open-in-view=false

spring.flyway.default-schema=${app.database.schema}
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

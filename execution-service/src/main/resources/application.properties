spring.application.name=execution-service
server.port=8083

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/execution_service_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

app.database.schema=execution_service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${app.database.schema}
spring.jpa.open-in-view=false

spring.flyway.default-schema=${app.database.schema}
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.execution.queue=execution.queue
app.rabbitmq.execution.exchange=execution.exchange
app.rabbitmq.execution.routing-key=execution.submit

app.rabbitmq.events.exchange=events.exchange
app.rabbitmq.events.execution-finalized.routing-key=events.execution.finalized
app.rabbitmq.events.audit-recorded.routing-key=events.audit.recorded
app.rabbitmq.events.audit-recorded.queue=execution.audit-recorded.queue
app.rabbitmq.events.audit-failed.routing-key=events.audit.failed
app.rabbitmq.events.audit-failed.queue=execution.audit-failed.queue

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$NotFound
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=feign.FeignException$BadRequest
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=feign.FeignException$Forbidden
resilience4j.circuitbreaker.configs.default.ignore-exceptions[3]=feign.FeignException$Unauthorized

resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.configs.default.cancel-running-future=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

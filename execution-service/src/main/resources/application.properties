spring.application.name=execution-service
server.port=8083

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/execution_service_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

app.database.schema=execution_service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${app.database.schema}
spring.jpa.open-in-view=false

spring.flyway.default-schema=${app.database.schema}
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

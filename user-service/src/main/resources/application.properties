spring.application.name=user-service
server.port=8081

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/user_service_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

app.database.schema=user_service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${app.database.schema}
spring.jpa.open-in-view=false

spring.flyway.default-schema=${app.database.schema}
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
